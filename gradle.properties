org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7.3's optional resource-path optimization dropped the first ABI split's
# resource archive in verification. Keep complete unoptimized resources in both
# APKs; the post-build verifier checks their manifests and identical bytecode.
android.enableResourceOptimizations=false
