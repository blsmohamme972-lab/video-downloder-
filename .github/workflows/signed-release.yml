name: Publish production-signed StreamSave APK update

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag matching the Gradle version, e.g. v1.2.0'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  signed-release:
    # Only the main branch can produce releases for the in-app updater.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release version
        env:
          TAG: ${{ inputs.version_tag }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo 'Release tag must be vMAJOR.MINOR.PATCH'; exit 1 ;;
          esac
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          test "$TAG" = "v$VERSION" || {
            echo "Release tag does not match versionName in app/build.gradle"; exit 1;
          }

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare pinned download engines
        run: python3 tools/prepare_engine.py

      - name: Restore private production signing key from repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.STREAMSAVE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STREAMSAVE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STREAMSAVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STREAMSAVE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "Production signing secrets are not configured."; exit 1;
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/streamsave-release.jks"
          chmod 600 "$RUNNER_TEMP/streamsave-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/streamsave-release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$RUNNER_TEMP/streamsave-signing.properties"
          chmod 600 "$RUNNER_TEMP/streamsave-signing.properties"

      - name: Build the signed ARM64 release
        run: |
          bash ./gradlew --no-daemon --max-workers=2 clean assembleRelease testDebugUnitTest lintRelease \
            -PstreamsaveSigningProperties="$RUNNER_TEMP/streamsave-signing.properties"

      - name: Publish GitHub Release for one-tap in-app update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version_tag }}
        run: |
          VERSION="${TAG#v}"
          APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -s "$APK"
          mkdir -p upload
          cp "$APK" "upload/StreamSave-$VERSION-arm64-v8a.apk"
          (cd upload && sha256sum "StreamSave-$VERSION-arm64-v8a.apk" > SHA256SUMS)
          gh release create "$TAG" \
            "upload/StreamSave-$VERSION-arm64-v8a.apk" \
            "upload/SHA256SUMS" \
            --target "$GITHUB_SHA" \
            --title "StreamSave $VERSION" \
            --notes "Production-signed StreamSave update. Android verifies the installed signing identity before replacing the existing app. No uninstall or data deletion is required when keys match."
