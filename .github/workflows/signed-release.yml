name: Publish production-signed StreamSave APK update

on:
  # Publishes by itself whenever main carries a version that has no release yet,
  # so whoever merges a version bump (a person or any AI assistant) ships it.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Optional. Leave empty to release the version in app/build.gradle'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  decide:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Is this version already released?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version_tag }}
        run: |
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          TAG="v$VERSION"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$TAG" ]; then
            echo "Requested $REQUESTED but app/build.gradle declares $TAG"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already published; nothing to release. Raise versionCode and versionName to ship an update." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi

  signed-release:
    needs: decide
    # Only the main branch can produce releases for the in-app updater.
    if: github.ref == 'refs/heads/main' && needs.decide.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Tags are needed to compare with the previous release.
          fetch-depth: 0

      - name: Validate release version
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo 'Release tag must be vMAJOR.MINOR.PATCH'; exit 1 ;;
          esac
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          test "$TAG" = "v$VERSION" || {
            echo "Release tag does not match versionName in app/build.gradle"; exit 1;
          }
          version_code() { sed -n 's/^[[:space:]]*versionCode[[:space:]]\{1,\}\([0-9]\{1,\}\)[[:space:]]*$/\1/p' | head -1; }
          CODE="$(version_code < app/build.gradle)"
          test -n "$CODE" || { echo "Cannot read versionCode from app/build.gradle"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionName and versionCode first."; exit 1
          fi
          # The in-app updater only offers a newer tag and Android only installs
          # a higher versionCode, so both must grow past the latest release.
          PREVIOUS="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ]; then
            NEWEST="$(printf '%s\n%s\n' "${PREVIOUS#v}" "$VERSION" | sort -V | tail -1)"
            if [ "$VERSION" = "${PREVIOUS#v}" ] || [ "$NEWEST" != "$VERSION" ]; then
              echo "$TAG must be newer than the latest release $PREVIOUS"; exit 1
            fi
            OLD_CODE="$(git show "$PREVIOUS:app/build.gradle" | version_code)"
            test -n "$OLD_CODE" && test "$CODE" -gt "$OLD_CODE" || {
              echo "versionCode $CODE must be greater than $OLD_CODE used by $PREVIOUS"; exit 1;
            }
            echo "PREVIOUS_TAG=$PREVIOUS" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare pinned download engines
        run: python3 tools/prepare_engine.py

      - name: Check release rules and downloader integrity
        run: |
          python3 tools/check_release_rules.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Restore private production signing key from repository secrets
        env:
          # One secret (preferred) or the four separate ones; see AGENTS.md.
          SIGNING_BUNDLE: ${{ secrets.STREAMSAVE_SIGNING }}
          KEYSTORE_BASE64: ${{ secrets.STREAMSAVE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STREAMSAVE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STREAMSAVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STREAMSAVE_KEY_PASSWORD }}
        run: |
          # Not captured: the script's ::add-mask:: lines must reach the log
          # runner, and its exit status must fail this step.
          python3 tools/restore_signing.py "$RUNNER_TEMP/signing"
          echo "SIGNING_PROPERTIES=$RUNNER_TEMP/signing/streamsave-signing.properties" >> "$GITHUB_ENV"

      - name: Build the signed ARM64 release
        run: |
          # Without this file Gradle would fall back to a throwaway debug key.
          test -s "$SIGNING_PROPERTIES" || { echo "Signing properties are missing"; exit 1; }
          bash ./gradlew --no-daemon --max-workers=2 clean assembleRelease testDebugUnitTest lintRelease \
            -PstreamsaveSigningProperties="$SIGNING_PROPERTIES"

      - name: Require the same signing key as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          signer() {
            "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1
          }
          NEW="$(signer app/build/outputs/apk/release/app-arm64-v8a-release.apk)"
          test -n "$NEW" || { echo "Cannot read the release signing certificate"; exit 1; }
          echo "Release signing certificate SHA-256: \`$NEW\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${PREVIOUS_TAG:-}" ]; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$PREVIOUS_TAG" --pattern '*arm64*.apk' --dir "$RUNNER_TEMP/previous"
            OLD="$(signer "$(ls "$RUNNER_TEMP"/previous/*.apk | head -1)")"
            if [ "$NEW" != "$OLD" ]; then
              echo "::error::This APK is signed with $NEW but $PREVIOUS_TAG used $OLD. Installed copies could not update. Restore the original keystore secrets."
              exit 1
            fi
          fi

      - name: Publish GitHub Release for one-tap in-app update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -s "$APK"
          mkdir -p upload
          cp "$APK" "upload/StreamSave-$VERSION-arm64-v8a.apk"
          (cd upload && sha256sum "StreamSave-$VERSION-arm64-v8a.apk" > SHA256SUMS)
          gh release create "$TAG" \
            "upload/StreamSave-$VERSION-arm64-v8a.apk" \
            "upload/SHA256SUMS" \
            --target "$GITHUB_SHA" \
            --title "StreamSave $VERSION" \
            --notes "Production-signed StreamSave update. Android verifies the installed signing identity before replacing the existing app. No uninstall or data deletion is required when keys match."
